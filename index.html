<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FramePulse HTML5 GPU & FPS Benchmark</title>
    <meta name="description" content="Precision HTML5 WebGL2 benchmark instrument for testing third-party FPS limiters, frame-time pacing, and 60-second GPU overclock stability with responsiveness protection." />
    <meta property="og:title" content="FramePulse HTML5 GPU & FPS Benchmark" />
    <meta property="og:description" content="Precision HTML5 WebGL2 benchmark instrument for testing third-party FPS limiters, frame-time pacing, and 60-second GPU overclock stability with responsiveness protection." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
  </head>
  <body class="bg-[#07090E] text-slate-100 antialiased selection:bg-cyan-500/30 selection:text-cyan-200">
    <div id="root"></div>
    <script>
      // If the user downloaded the repository and double-clicked index.html directly in Windows File Explorer (file:// protocol),
      // browsers block TypeScript ES modules (/src/main.tsx). Automatically forward to the self-contained FramePulse-Standalone.html!
      if (window.location.protocol === 'file:') {
        window.location.replace('./FramePulse-Standalone.html');
        document.getElementById('root').innerHTML =
          '<div style="min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;background:#07090E;color:#F1F5F9;font-family:sans-serif;">' +
            '<div style="max-width:480px;background:#0B0E17;border:1px solid #1E293B;border-radius:8px;padding:28px;text-align:center;">' +
              '<div style="font-family:monospace;font-size:12px;color:#22D3EE;margin-bottom:8px;">LOCAL FILE PROTOCOL DETECTED</div>' +
              '<h1 style="font-size:20px;font-weight:700;margin-bottom:10px;">Launch FramePulse Standalone Edition</h1>' +
              '<p style="font-size:13px;color:#94A3B8;line-height:1.5;margin-bottom:20px;">Opening the zero-dependency standalone HTML5 benchmark file for Windows 10 / 11...</p>' +
              '<a href="./FramePulse-Standalone.html" style="display:inline-block;background:#22D3EE;color:#020617;font-weight:600;font-size:14px;padding:10px 20px;border-radius:6px;text-decoration:none;">Open FramePulse-Standalone.html</a>' +
            '</div>' +
          '</div>';
      }
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
